[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memtrace-sdk"
dynamic = ["version"]
description = "Python SDK for Memtrace — LLM-agnostic memory layer for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    { name = "Basekick Labs" },
]
keywords = ["memtrace", "ai", "agents", "memory", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "respx>=0.21",
    "ruff>=0.1",
]

[project.urls]
Homepage = "https://basekick.net/memtrace"
Repository = "https://github.com/Basekick-Labs/memtrace"
Documentation = "https://docs.basekick.net/memtrace"
Issues = "https://github.com/Basekick-Labs/memtrace/issues"
Changelog = "https://github.com/Basekick-Labs/memtrace/blob/main/sdks/python/CHANGELOG.md"

[tool.hatch.version]
path = "src/memtrace/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/memtrace"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100
