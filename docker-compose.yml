services:
  memtrace:
    build: .
    container_name: memtrace
    volumes:
      - memtrace-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - traefik
    environment:
      # Required: AES-256-GCM master key used to encrypt per-org Arc API keys at
      # rest. Generate once with `docker run --rm memtrace memtrace keygen master`
      # and inject from your secret manager. Losing this value makes encrypted
      # secrets unrecoverable.
      - MEMTRACE_MASTER_KEY=${MEMTRACE_MASTER_KEY:?MEMTRACE_MASTER_KEY is required}
      - MEMTRACE_AUTH_ENABLED=true
      - MEMTRACE_LOG_FORMAT=json
      # Per-org Arc connections (URL, API key, database) live in the metadata
      # DB and are managed via the `memtrace org` CLI — there are no
      # MEMTRACE_ARC_URL / MEMTRACE_ARC_API_KEY env vars anymore. After the
      # container is up, provision orgs with:
      #
      #   docker compose exec memtrace memtrace org create acme
      #   docker compose exec memtrace memtrace org add-arc <org_id> \
      #       --url http://arc:8000 --api-key <key> --database <db>
      #   docker compose exec memtrace memtrace key create --org <org_id> --name <name>
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.memtrace.rule=Host(`memtrace.basekick.net`)"
      - "traefik.http.routers.memtrace.entrypoints=https"
      - "traefik.http.routers.memtrace.tls.certresolver=letsencrypt"
      - "traefik.http.services.memtrace.loadbalancer.server.port=9100"
      - "traefik.docker.network=traefik"

networks:
  traefik:
    external: true

volumes:
  memtrace-data:
    driver: local
